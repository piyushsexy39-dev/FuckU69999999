services:
  cricket-bot:
    build: .
    container_name: ultimate-cricket-bot
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/gullycric.db
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:3000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
